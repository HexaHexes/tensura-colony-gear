[[mods]]
modId = "tensura_colony_gear"
version = "1.0.0"
displayName = "Tensura Colony Gear"
authors = "kurok"
description = '''
Folds Tensura: Reincarnated gear into MineColonies' citizen weapon/tool/armor
ladder using only MineColonies' public registration API (no mixins):

- Compact vanilla ladder: wood/gold/stone = level 1, iron/diamond = 2,
  netherite = 3.
- Tensura tools and blades: silver/low_magisteel = 2, high_magisteel/
  mithril/orichalcum = 3, pure_magisteel/adamantite = 4, hihiirokane = 5.
- Tensura armor needs no registration: MineColonies derives its level from
  the armor points, which already grades the sets sensibly.
- Multitools get a level and are recognized as custom weapons for
  MineColonies' equipment-type checks.
'''

